# Correspondence between reitter-outline.yml (r), fowkes-outline.yml (f) and
# mew23-outline.yml (m).
#
# Each row is the smallest stretch of text that all three editions divide the
# same way. A cell names the deepest node in that edition containing the
# stretch. When one edition divides more finely, the coarser edition's id
# repeats on consecutive rows (e.g. Reitter ch. 5 against Fowkes 7.1 and 7.2).
# null = that edition does not contain the text.
#
# body:      the text of Volume 1. In every column the ids appear in reading
#            order, and an id's repeats are consecutive.
# apparatus: prefaces, afterwords and editorial material. Not ordered.
#            Reitter prints Marx's 1872 afterword at the end of the book,
#            Fowkes and MEW print it before Chapter 1.
#
# Optional row fields:
#   partial: [r|f|m]  that edition contains only part of the text
#
# measure: the edition whose page numbers set block heights on the page when
# Titles is off. end_page is the first page after the body text (MEW's
# Anhang starts on S. 805; the last text page is 802).

measure: { edition: m, end_page: "803" }

apparatus:

  # Marx's and Engels' prefaces and afterwords
  - { r: r-preface-1867, f: f-preface-1, m: m-vorwort-1 }
  - { r: r-afterword, f: f-postface-2, m: m-nachwort-2 }
  - { r: null, f: f-preface-fr, m: m-vornachwort-fr-1 }
  - { r: r-app3-advice, f: f-postface-fr, m: m-vornachwort-fr-2 }
  - { r: r-app4-engels-excerpt, f: f-preface-3, m: m-vorwort-3, partial: [r] }
  - { r: null, f: f-preface-en, m: m-vorwort-en }
  - { r: null, f: f-preface-4, m: m-vorwort-4 }

  # Material in one edition only
  - { r: r-fm-foreword, f: null, m: null }
  - { r: r-fm-intro, f: null, m: null }
  - { r: r-fm-transpref, f: null, m: null }
  - { r: r-fm-edition, f: null, m: null }
